name: release
on:
  push:
    # `claude plugin tag` creates `<name>--v<version>`; also accept plain `v*`.
    tags: ["*--v*", "v*"]
# The repo default for GITHUB_TOKEN is read-only, so the release step got a bare 403
# ("Resource not accessible by integration") and NO release has ever been produced -
# v1.1.1 was tagged and silently published nothing. Ask for write here explicitly.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Verify version and bundled copies
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - name: Run portable unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build skill bundle
        run: bash scripts/build-skill.sh dist/watch.skill
      - name: Write bundle checksum
        run: sha256sum dist/watch.skill > dist/watch.skill.sha256
      - name: Attach bundle to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/watch.skill
            dist/watch.skill.sha256
